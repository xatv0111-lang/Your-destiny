<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Генератор Судьбы</title>

<!-- ✅ VK Bridge -->
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

<style>
/* (твой CSS без изменений) */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
/* ... весь твой CSS 그대로 ... */
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="wrap">
  <!-- (вся твоя верстка без изменений) -->
</div>

<script>
/* =========================
   ✅ VK INIT (КРИТИЧНО)
========================= */

// Проверка — открыто ли внутри VK
if (typeof vkBridge !== 'undefined') {
  vkBridge.send('VKWebAppInit')
    .then(() => console.log('VK Mini App initialized'))
    .catch(console.error);
} else {
  console.log('Открыто вне VK');
} else {
  vkBridge.send('VKWebAppInit')
    .then(() => {
      console.log('VK Mini App initialized');

      // Дополнительно: проверка API
      return vkBridge.send('VKWebAppGetUserInfo');
    })
    .then(user => {
      console.log('User:', user);
    })
    .catch(err => {
      console.error('VK error:', err);
    });
}

/* =========================
   ТВОЙ JS (без изменений)
========================= */

const fates = {
  career: [
    { e:"💼", t:"Тебя повысят", s:"Прямо сегодня. Или нет — но когда-нибудь точно." },
    { e:"🖨️", t:"Принтер снова сломается", s:"И именно в тот момент, когда тебе очень нужно." },
  ],
  love: [
    { e:"💘", t:"Встретишь интересного человека", s:"Вы оба уставитесь в телефон и ничего не скажете." },
  ],
  life: [
    { e:"🛌", t:"Ляжешь спать в 23:00", s:"По факту — в 01:47. Но намерение считается." },
  ],
  weird: [
    { e:"🦆", t:"Утка посмотрит с осуждением", s:"Ты поймёшь — заслужено." },
  ],
};

const hints = [
  "Звёзды сказали именно это",
  "Оспорить решение вселенной нельзя",
];

let category = 'all';
let count = 0;

function setCategory(cat, btn) {
  category = cat;
  document.querySelectorAll('.cat').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function getPool() {
  if (category === 'all') return Object.values(fates).flat();
  return fates[category] || [];
}

function reveal() {
  const orb = document.getElementById('orb');
  const glyph = document.getElementById('orb-glyph');
  const label = document.getElementById('orb-label');
  const box = document.getElementById('result-box');
  const inner = document.getElementById('result-inner');

  orb.classList.add('spinning');
  orb.disabled = true;
  label.textContent = '...';
  inner.innerHTML = '<div class="result-placeholder">· · ·</div>';
  box.classList.remove('revealed');

  setTimeout(() => {
    const pool = getPool();
    const fate = pool[Math.floor(Math.random() * pool.length)];
    count++;

    glyph.textContent = fate.e;
    orb.classList.remove('spinning');
    orb.disabled = false;
    label.textContent = 'Ещё раз';
    box.classList.add('revealed');

    inner.innerHTML = `
      <div class="fade-in">
        <span class="result-emoji">${fate.e}</span>
        <div class="result-title">${fate.t}</div>
        <div class="result-sub">${fate.s}</div>
      </div>
    `;

    document.getElementById('counter').textContent = `Предсказаний получено: ${count}`;
    document.getElementById('hint').textContent = hints[Math.floor(Math.random() * hints.length)];
  }, 850);
}

const starEl = document.getElementById('stars');
for (let i = 0; i < 80; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  s.style.cssText = `
    left:${Math.random()*100}%;
    top:${Math.random()*100}%;
    --dur:${2+Math.random()*4}s;
    --delay:-${Math.random()*4}s;
    --base:${0.1+Math.random()*0.4};
  `;
  starEl.appendChild(s);
}
</script>

</body>
</html>
