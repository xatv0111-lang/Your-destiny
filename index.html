<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Генератор Судьбы</title>

<!-- VK Bridge -->
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0a0f;
  --card: #16161f;
  --gold: #c9a84c;
  --text: #f0ede4;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Courier New', monospace;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.wrap {
  text-align: center;
}

h1 {
  font-size: 3rem;
  margin-bottom: 20px;
}

.orb-ring {
  width: 200px;
  height: 200px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: auto;
  animation: pulse 4s infinite;
}

@keyframes pulse {
  0%,100% { box-shadow: 0 0 20px rgba(201,168,76,0.1); }
  50% { box-shadow: 0 0 50px rgba(201,168,76,0.3); }
}

.orb-btn {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  background: var(--card);
  border: 1px solid rgba(255,255,255,0.2);
  font-size: 40px;
  cursor: pointer;
}

.result {
  margin-top: 30px;
  padding: 20px;
  border: 1px solid rgba(255,255,255,0.1);
}

/* звезды */
.star {
  position: fixed;
  width: 2px;
  height: 2px;
  background: white;
  border-radius: 50%;
  opacity: 0.6;
}
</style>
</head>

<body>

<div class="wrap">
  <h1>Твоя Судьба</h1>

  <div class="orb-ring">
    <button class="orb-btn" onclick="reveal()">🔮</button>
  </div>

  <div class="result" id="result">
    Нажми, чтобы узнать
  </div>
</div>

<script>
/* =====================
   VK INIT (НЕ ЗАВИСАЕТ)
===================== */
try {
  if (window.vkBridge) {
    vkBridge.send('VKWebAppInit')
      .then(() => console.log('VK OK'))
      .catch(() => console.log('VK fail'));
  }
} catch (e) {
  console.log('VK skipped');
}

/* =====================
   ЛОГИКА
===================== */
const fates = [
  "Тебя ждёт неожиданный поворот 🔥",
  "Сегодня всё сложится удачно 🍀",
  "Кто-то думает о тебе ❤️",
  "Лучше отдохни сегодня 😴",
  "Сюрприз уже близко 🎁"
];

function reveal() {
  const el = document.getElementById('result');
  el.innerText = fates[Math.floor(Math.random() * fates.length)];
}

/* =====================
   ЗВЁЗДЫ (без ошибок)
===================== */
for (let i = 0; i < 60; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  s.style.left = Math.random() * 100 + '%';
  s.style.top = Math.random() * 100 + '%';
  document.body.appendChild(s);
}
</script>

</body>
</html>
