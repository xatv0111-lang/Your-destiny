<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Генератор Судьбы</title>

<!-- VK Bridge -->
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

<style>
body {
  background: #0a0a0f;
  color: white;
  font-family: Arial;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

button {
  padding: 20px;
  font-size: 18px;
  cursor: pointer;
}

.result {
  margin-top: 20px;
  text-align: center;
}
</style>
</head>

<body>

<div>
  <button onclick="reveal()">🔮 Узнать судьбу</button>
  <div class="result" id="result">Нажми кнопку</div>
</div>

<script>
/* ======================
   VK INIT (без ошибок)
====================== */
try {
  if (typeof vkBridge !== 'undefined') {
    vkBridge.send('VKWebAppInit')
      .then(() => console.log('VK Mini App initialized'))
      .catch(console.error);
  }
} catch (e) {
  console.log('VK skipped');
}

/* ======================
   ЛОГИКА ПРИЛОЖЕНИЯ
====================== */

const fates = [
  "Тебя ждёт удача 🍀",
  "Сегодня лучше отдохнуть 😴",
  "Кто-то думает о тебе ❤️",
  "Жди неожиданный поворот 🔥",
  "Ты на правильном пути 🚀"
];

function reveal() {
  const result = document.getElementById('result');
  const random = fates[Math.floor(Math.random() * fates.length)];
  result.innerText = random;
}
</script>

</body>
</html>
