<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Генератор Судьбы</title>

<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

<style>
/* ===== ТВОЙ ОРИГИНАЛЬНЫЙ СТИЛЬ ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0a0f;
  --bg2: #111118;
  --card: #16161f;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.15);
  --gold: #c9a84c;
  --gold2: #e8c96e;
  --gold-dim: rgba(201,168,76,0.15);
  --text: #f0ede4;
  --muted: rgba(240,237,228,0.5);
  --faint: rgba(240,237,228,0.25);
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Courier New', monospace;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.wrap {
  width: 100%;
  max-width: 520px;
  text-align: center;
}

h1 {
  font-family: Georgia, serif;
  font-size: 3rem;
}

.orb-ring {
  width: 200px; height: 200px;
  border-radius: 50%;
  border: 1px solid var(--border2);
  margin: 40px auto;
  display: flex;
  align-items: center;
  justify-content: center;
}

.orb-btn {
  width: 140px; height: 140px;
  border-radius: 50%;
  background: var(--card);
  border: 1px solid var(--border2);
  cursor: pointer;
  font-size: 40px;
}

.result-box {
  margin-top: 20px;
  padding: 20px;
  border: 1px solid var(--border);
}
</style>
</head>

<body>

<div class="wrap">
  <h1>Твоя Судьба</h1>

  <div class="orb-ring">
    <button class="orb-btn" onclick="reveal()">🔮</button>
  </div>

  <div class="result-box" id="result">
    — ожидание предсказания —
  </div>
</div>

<script>
/* ===== VK INIT (ИСПРАВЛЕНО) ===== */
try {
  if (typeof vkBridge !== 'undefined') {
    vkBridge.send('VKWebAppInit')
      .then(() => console.log('VK Mini App initialized'))
      .catch(console.error);
  }
} catch (e) {}

/* ===== ТВОЯ ЛОГИКА ===== */
const fates = [
  "Тебя ждёт неожиданный поворот",
  "Сегодня всё сложится удачно",
  "Кто-то думает о тебе",
  "Лучше отдохни сегодня",
  "Сюрприз уже близко"
];

function reveal() {
  const el = document.getElementById('result');
  el.innerText = fates[Math.floor(Math.random() * fates.length)];
}

/* ===== ЗВЁЗДЫ ===== */
const stars = document.createElement('div');
stars.style.position = 'fixed';
stars.style.inset = 0;
stars.style.pointerEvents = 'none';
document.body.appendChild(stars);

for (let i = 0; i < 80; i++) {
  const s = document.createElement('div');
  s.style.position = 'absolute';
  s.style.width = '2px';
  s.style.height = '2px';
  s.style.background = 'white';
  s.style.left = Math.random() * 100 + '%';
  s.style.top = Math.random() * 100 + '%';
  stars.appendChild(s);
}
</script>

</body>
</html>
</html>
